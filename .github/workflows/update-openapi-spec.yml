name: Update OpenAPI Spec in client-sdk

on:
  push:
    branches:
      - develop

concurrency:
  group: update-openapi-spec-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-openapi-spec:
    name: Update OpenAPI Spec
    runs-on: ubuntu-latest
    if: github.repository == 'kestra-io/kestra'
    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - uses: kestra-io/actions/composite/setup-build@main
        name: Setup - Build
        with:
          java-enabled: true
          java-version: 25

      - name: Generate OpenAPI spec
        run: ./gradlew generateOpenapiSpec
        shell: bash

      - uses: actions/checkout@v6
        name: Checkout - client-sdk
        with:
          repository: kestra-io/client-sdk
          token: ${{ secrets.GH_PERSONAL_TOKEN }}
          path: client-sdk

      - name: Copy spec to client-sdk
        shell: bash
        run: cp openapi.yml client-sdk/kestra.yml

      - name: Commit and push to client-sdk
        shell: bash
        working-directory: client-sdk
        run: |
          git config user.name "kestra-io"
          git config user.email "hello@kestra.io"
          git add kestra.yml
          if git diff --cached --quiet; then
            echo "No changes to OpenAPI spec"
          else
            git commit -m "ci: auto-update kestra.yml from kestra@${{ github.sha }} [skip ci]"
            git push
          fi
