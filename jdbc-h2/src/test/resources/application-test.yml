datasources:
  h2:
    url: jdbc:h2:mem:public;LOCK_TIMEOUT=30000;TIME ZONE=UTC;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driverClassName: org.h2.Driver

kestra:
  serverType: STANDALONE
  server:
    liveness:
      enabled: false
    terminationGracePeriod: 5s
    service:
      purge:
        initialDelay: 1h
        fixedDelay: 1d
        retention: 30d
  queue:
    type: h2
    messageProtection:
      enabled: true
      limit: 1048576

  repository:
    type: h2
  storage:
    type: local
    local:
      basePath: /tmp/unittest
  jdbc:
    queues:
      minPollInterval: 10ms
      maxPollInterval: 100ms
      pollSwitchInterval: 5s

  executor:
    executionDelayLoopPeriodicityMs: 250
    monitorSlaLoopPeriodicityMs: 250
    multipleConditionPurgeLoopPeriodicityMs: 1000

  grpc:
    maxRetryAttempts: 1
    shutdownTimeout: 3s
  controller:
    port: ${random.int[20000,32000]} # keep out of the ephemeral port range (32768-60999): an outbound socket could steal a random.port between config resolution and the controller bind
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}
# Disable Micronaut embedded gRPC server and health check
grpc:
  server:
    enabled: false
    health:
      enabled: false

logger:
  levels:
    "io.kestra.core.migration": WARN