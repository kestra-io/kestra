id: approval-inputs
namespace: io.kestra.tests

tasks:
  - id: approval
    type: io.kestra.plugin.core.flow.Approval
    inputs:
      - id: reason
        type: STRING
    onApprove:
      - id: approved
        type: io.kestra.plugin.core.log.Log
        message: "Approved"
    onDeny:
      - id: denied
        type: io.kestra.plugin.core.log.Log
        message: "Denied"
