id: parallel-failfast-with-errors
namespace: io.kestra.tests

tasks:
  - id: parallel
    type: io.kestra.plugin.core.flow.Parallel
    childFailurePolicy: FAIL_FAST
    concurrent: 2
    tasks:
      - id: fail
        type: io.kestra.plugin.core.execution.Fail

      - id: slow1
        type: io.kestra.plugin.core.flow.Sleep
        duration: PT0.1S

      - id: slow2
        type: io.kestra.plugin.core.flow.Sleep
        duration: PT10S

    errors:
      - id: error-handler
        type: io.kestra.plugin.core.log.Log
        message: "error handler executed"

    finally:
      - id: finally-handler
        type: io.kestra.plugin.core.log.Log
        message: "finally handler executed"
