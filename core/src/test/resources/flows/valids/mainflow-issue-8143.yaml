id: mainflow-issue-8143
namespace: io.kestra.tests
description: Main flow for testing issue #8143

inputs:
  - id: box
    type: MULTISELECT
    values:
      - Inbox
      - Sent

tasks:
  - id: foreach
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: inbox
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.box contains 'Inbox' }}"
        then:
          - id: subflow_inbox
            type: io.kestra.plugin.core.flow.Subflow
            namespace: "{{ flow.namespace }}"
            flowId: subflow-issue-8143
            inputs:
              counter: "{{ taskrun.attemptsCount }}"
      - id: sent
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.box contains 'Sent' }}"
        then:
          - id: subflow_sent
            type: io.kestra.plugin.core.flow.Subflow
            namespace: "{{ flow.namespace }}"
            flowId: subflow-issue-8143
            inputs:
              counter: "{{ taskrun.attemptsCount }}"

pluginDefaults:
  - type: io.kestra.plugin.core.flow.Subflow
    values:
      retry:
        type: constant
        maxAttempt: 5
        interval: PT1S
