name: Pull Request Workflow

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-pr
  cancel-in-progress: true

jobs:
  # When an OSS ci start, we trigger an EE one
  trigger-ee:
    runs-on: ubuntu-latest
    steps:
    - name: Generate GitHub App token for kestra-ee dispatch
      id: ee-token
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.GH_BOT_APP_ID }}
        private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
        owner: kestra-io
        repositories: kestra-ee

    # PR pre-check: skip if PR from a fork OR EE already has a branch with same name
    - name: Check EE repo for branch with same name
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
      id: check-ee-branch
      uses: actions/github-script@v9
      with:
        github-token: ${{ steps.ee-token.outputs.token }}
        script: |
          const pr = context.payload.pull_request;
          if (!pr) {
            core.setOutput('exists', 'false');
            return;
          }
          const branch = pr.head.ref;
          const [owner, repo] = 'kestra-io/kestra-ee'.split('/');
          try {
            await github.rest.repos.getBranch({ owner, repo, branch });
            core.setOutput('exists', 'true');
          } catch (e) {
            if (e.status === 404) {
              core.setOutput('exists', 'false');
            } else {
              core.setFailed(e.message);
            }
          }

      # Targeting pull request (only if not from a fork and EE has no branch with same name)
    - name: Trigger EE Workflow (pull request, with payload)
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
      if: ${{ github.event_name == 'pull_request'
        && github.event.pull_request.number != ''
        && github.event.pull_request.head.repo.fork == false
        && steps.check-ee-branch.outputs.exists == 'false' }}
      with:
        token: ${{ steps.ee-token.outputs.token }}
        repository: kestra-io/kestra-ee
        event-type: "oss-updated"
        client-payload: >-
          {"commit_sha":"${{ github.event.pull_request.head.sha }}","pr_repo":"${{ github.repository }}"}

      # Always trigger EE OpenAPI check on non-fork PRs (regardless of EE same-name branch)
    - name: Trigger EE OpenAPI spec check
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
      if: ${{ github.event_name == 'pull_request'
        && github.event.pull_request.number != ''
        && github.event.pull_request.head.repo.fork == false }}
      with:
        token: ${{ steps.ee-token.outputs.token }}
        repository: kestra-io/kestra-ee
        event-type: "oss-pr-openapi-check"
        client-payload: >-
          {"commit_sha":"${{ github.event.pull_request.head.sha }}","pr_number":"${{ github.event.pull_request.number }}","oss_branch":"${{ github.event.pull_request.head.ref }}"}

  file-changes:
    if: ${{ github.event.pull_request.draft == false }}
    name: File changes detection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
      ui-design-system: ${{ steps.changes.outputs.ui-design-system }}
      translations: ${{ steps.changes.outputs.translations }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            ui:
              - 'ui/**'
            ui-design-system:
              - 'ui/packages/design-system/**'
            backend:
              - '!{ui,.github}/**'
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend - Tests
    needs: [file-changes]
    if: "needs.file-changes.outputs.ui == 'true'"
    uses: kestra-io/actions/.github/workflows/kestra-oss-frontend-tests.yml@main
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  design-system-frontend:
    name: Frontend - Design System tests
    needs: [file-changes]
    if: "needs.file-changes.outputs.ui-design-system == 'true'"
    uses: kestra-io/actions/.github/workflows/kestra-oss-designsystem-tests.yml@main
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # EXPERIMENT (do not merge): inlined from
  # kestra-io/actions/.github/workflows/kestra-oss-backend-tests.yml@main to run the
  # Gradle check serially with every task forced to re-run.
  # - `needs`/`if` on file-changes are intentionally dropped: the backend filter
  #   excludes `.github/**`, so this workflow-only PR would otherwise skip the job.
  # - `--no-parallel` is required on top of dropping `--parallel`: gradle.properties
  #   sets `org.gradle.parallel=true`, which would silently re-enable parallelism.
  # - `--rerun-tasks` defeats up-to-date checks and the build cache so all tests run.
  backend:
    name: Backend - Tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      checks: write
      actions: read
      pull-requests: write
    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
        name: Checkout - Current ref
        with:
          fetch-depth: 0

      - uses: kestra-io/actions/composite/setup-build@main
        name: Setup - Build
        with:
          java-enabled: true
          node-enabled: true
          python-enabled: true
          java-version: 25

      - name: Setup - Start docker compose
        shell: bash
        run: docker compose -f docker-compose-ci.yml up -d

      - name: Gradle - check (serial, rerun all tasks)
        shell: bash
        run: |
          ./gradlew check --rerun-tasks --no-parallel

      - name: comment PR with test report
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --ci $(pwd)

      - name: generate test report in logs and fail if any failed tests
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --fail-on-error $(pwd)

      - name: Report - Java
        uses: kestra-io/actions/composite/report-java@main
        if: ${{ !cancelled() }}
        with:
          secrets: ${{ toJSON(secrets) }}

  e2e-tests:
    name: E2E - Tests
    uses: kestra-io/actions/.github/workflows/kestra-oss-e2e-tests.yml@main
    with:
      java-version: 25

  generate-pull-request-docker-image:
    name: Generate PR docker image
    uses: kestra-io/actions/.github/workflows/kestra-oss-pullrequest-publish-docker.yml@main
    with:
      java-version: 25

  otel-export-trace:
    name: OpenTelemetry - Export Trace
    runs-on: ubuntu-latest
    if: always()
    needs: [ trigger-ee, file-changes, frontend, design-system-frontend, backend, e2e-tests, generate-pull-request-docker-image ]
    env:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
    steps:
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          mode: export-all
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
