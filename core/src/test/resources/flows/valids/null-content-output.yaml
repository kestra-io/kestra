id: null-content-output
namespace: io.kestra.tests

tasks:
  - id: produce
    type: io.kestra.core.tasks.test.NullContentOutputTask

  - id: render_null
    type: io.kestra.plugin.core.debug.Return
    format: "[{{ outputs.produce.records[0].b }}]"

  - id: render_sibling
    type: io.kestra.plugin.core.debug.Return
    format: "[{{ outputs.produce.records[0].a }}]"
