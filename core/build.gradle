plugins {
    id 'com.github.node-gradle.node' version '7.1.0'
}

configurations {
    tests
    implementation.extendsFrom(micronaut)
}

tasks.register('copyGradleProperties', Copy) {
    group = "build"
    shouldRunAfter compileJava

    from '../gradle.properties'
    into 'src/main/resources'
}

processResources.dependsOn copyGradleProperties

dependencies {
    // Kestra
    api project(':model')
    annotationProcessor project(':processor')

    // serializers
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-ion"

    // reactor
    api "io.projectreactor:reactor-core"

    // awaitility
    api "org.awaitility:awaitility"

    // micronaut
    api "io.micronaut.data:micronaut-data-model"
    api "io.micronaut:micronaut-management"
    implementation "io.micronaut:micronaut-http-server-netty"

    // utils
    implementation 'com.github.oshi:oshi-core'
    implementation 'io.pebbletemplates:pebble'
    implementation "co.elastic.logging:logback-ecs-encoder"
    implementation "de.focus-shift:jollyday-core"
    implementation "de.focus-shift:jollyday-jaxb"
    implementation 'nl.basjes.gitignore:gitignore-reader'
    implementation "dev.failsafe:failsafe"
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.bouncycastle:bcprov-jdk18on'
    implementation 'com.github.ksuid:ksuid:1.1.4'
    api 'org.apache.httpcomponents.client5:httpclient5'

    // plugins
    implementation 'org.apache.maven.resolver:maven-resolver-impl'
    implementation 'org.apache.maven.resolver:maven-resolver-supplier-mvn3'
    implementation 'org.apache.maven.resolver:maven-resolver-connector-basic'
    implementation 'org.apache.maven.resolver:maven-resolver-transport-file'
    implementation 'org.apache.maven.resolver:maven-resolver-transport-apache'

    // scheduler
    implementation "com.cronutils:cron-utils"

    // schema
    implementation ("com.github.victools:jsonschema-generator") {
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation "com.github.victools:jsonschema-module-jakarta-validation"
    implementation "com.github.victools:jsonschema-module-jackson"
    implementation "com.github.victools:jsonschema-module-swagger-2"

    // Json Diff
    implementation ('com.github.java-json-tools:json-patch') {
        exclude group: 'com.fasterxml.jackson.core'
    }

    // Json schema validator
    implementation 'com.networknt:json-schema-validator'

    // micrometer
    implementation "io.micronaut.micrometer:micronaut-micrometer-observation"
    implementation 'io.micrometer:micrometer-java21'

    // test
    testAnnotationProcessor project(':processor')
    testImplementation project(':tests')

    testImplementation project(':repository-memory')
    testImplementation project(':runner-memory')
    testImplementation project(':storage-local')
    testImplementation project(':worker')
    testImplementation project(':scheduler')
    testImplementation project(':executor')
    testImplementation project(':indexer')

    testImplementation "io.micronaut:micronaut-http-client"
    testImplementation "io.micronaut:micronaut-http-server-netty"
    testImplementation "io.micronaut:micronaut-management"

    testImplementation "org.testcontainers:testcontainers:2.0.5"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.5"
    testImplementation "org.bouncycastle:bcpkix-jdk18on"

    testImplementation "org.wiremock:wiremock-jetty12"
}

// The http task artifact lives next to the tasks it decorates and is built into the resources
// directory that PluginScanner reads (plugin-ui/manifest.json).
def httpUiDir = layout.projectDirectory.dir('src/main/java/io/kestra/plugin/core/http/ui')
def pluginUiOutput = layout.projectDirectory.dir('src/main/resources/plugin-ui')

// Keep node_modules and the front-end sources out of the java source set, and so out of the sources jar.
sourceSets.main.java.exclude 'io/kestra/plugin/core/http/ui/**'

tasks.register('npmInstallUI', com.github.gradle.node.npm.task.NpmTask) {
    args = ['ci', '--fetch-retries=5', '--fetch-retry-mintimeout=5000', '--fetch-retry-maxtimeout=60000']
    workingDir = httpUiDir.asFile
    inputs.files(httpUiDir.file('package.json'), httpUiDir.file('package-lock.json'))
    outputs.dir(httpUiDir.dir('node_modules'))
}

tasks.register('buildUI', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn 'npmInstallUI'
    args = ['run', 'build', '--', '--outDir', pluginUiOutput.asFile.absolutePath]
    workingDir = httpUiDir.asFile
    inputs.dir(httpUiDir.dir('src'))
    inputs.files(
        httpUiDir.file('package.json'),
        httpUiDir.file('package-lock.json'),
        httpUiDir.file('vite.config.ts'),
        httpUiDir.file('tsconfig.json'),
        httpUiDir.file('index.html')
    )
    outputs.dir(pluginUiOutput)
}

processResources.dependsOn 'buildUI'
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'buildUI' }

// Spotless would otherwise walk node_modules and fail on the implicit dependency on npmInstallUI.
spotless {
    java {
        targetExclude 'src/main/java/io/kestra/plugin/core/http/ui/**'
    }
}
