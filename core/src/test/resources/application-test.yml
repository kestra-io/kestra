jackson:
  serialization:
    writeDatesAsTimestamps: false
    writeDurationsAsTimestamps: false
  serialization-inclusion: non_null

micronaut:
  metrics:
    export:
      otlp:
        enabled: false

datasources:
  h2:
    url: jdbc:h2:mem:db-${random.uuid};TIME ZONE=UTC;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driverClassName: org.h2.Driver

kestra:
  encryption:
    secret-key: I6EGNzRESu3X3pKZidrqCGOHQFUFC0yK
  url: https://mysuperhost.com/subpath
  server-type: STANDALONE
  repository:
    type: h2
  queue:
    type: h2
  storage:
    type: local
    local:
      base-path: /tmp/unittest
  jdbc:
    queues:
      min-poll-interval: 10ms
      max-poll-interval: 100ms
      poll-switch-interval: 5s

  variables:
    globals:
      string: "string"
      int: 1
      bool: true
      nested:
        int: 2

  server:
    liveness:
      enabled: false
    service:
      purge:
        initial-delay: 1h
        fixed-delay: 1d
        retention: 30d
    termination-grace-period: 5s

  anonymous-usage-report:
    enabled: false
    uri: http://localhost:8080/

  unittest: true

  plugins:
    configurations:
      - type: io.kestra.plugin.Test0
        values:
          prop0: value0
      - type: io.kestra.plugin.Test1
        values:
          prop1: value1
      - type: io.kestra.plugin.Test2
        values:
          prop2: value2
      - type: io.kestra.plugin.core.trigger.Schedule
        values:
          recoverMissedSchedules: ALL
      - type: io.kestra.core.runners.test.task.Alias
        values:
          prop0: value0

  tasks:
    http:
      denied-list:
        - http://dangerous-url.com

  grpc:
    maxRetryAttempts: 1
    shutdownTimeout: 3s
  controller:
    port: ${random.int[20000,32000]} # keep out of the ephemeral port range (32768-60999): an outbound socket could steal a random.port between config resolution and the controller bind
    maxConnectionAgeGrace: 0s
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}
# Disable Micronaut embedded gRPC server and health check
grpc:
  server:
    enabled: false
    health:
      enabled: false