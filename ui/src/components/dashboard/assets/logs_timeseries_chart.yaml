id: logs_timeseries
type: io.kestra.plugin.core.dashboard.chart.TimeSeries
chartOptions:
  displayName: Log Levels Over Time
  description: Count of logs grouped by timestamp and level
  legend:
    enabled: true
  column: date
  colorByColumn: level
  width: 12

data:
  type: io.kestra.plugin.core.dashboard.data.Logs
  columns:
    date:
      field: DATE
      displayName: Log Timestamp
    level:
      field: LEVEL
    count:
      displayName: Log Count
      agg: COUNT
      graphStyle: BARS
