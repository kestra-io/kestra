id: retry-flowable-nested-normal-task
namespace: io.kestra.tests

tasks:
  - id: seq
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: hello
        type: io.kestra.plugin.core.log.Log
        message: hi
        retry:
          type: constant
          maxAttempts: 2
          interval: PT1S
          behavior: RETRY_FLOWABLE
