datasources:
  mysql:
    url: jdbc:mysql://localhost:3306/kestra_unit
    driverClassName: com.mysql.cj.jdbc.Driver
    username: kestra
    password: k3str4
    dialect: MYSQL
    maximumPoolSize: 32
    minimumIdle: 8
    connectionTimeout: 30000
    idleTimeout: 600000
    maxLifetime: 1800000
    transactionIsolation: TRANSACTION_READ_COMMITTED

kestra:
  serverType: STANDALONE
  server:
    liveness:
      enabled: false
    terminationGracePeriod: 5s
    service:
      purge:
        initialDelay: 1h
        fixedDelay: 1d
        retention: 30d
  queue:
    type: mysql
    messageProtection:
      enabled: true
      limit: 1048576
  repository:
    type: mysql
  storage:
    type: local
    local:
      basePath: /tmp/unittest
  jdbc:
    queues:
      minPollInterval: 10ms
      maxPollInterval: 100ms
      pollSwitchInterval: 5s
  executor:
    executionDelayLoopPeriodicityMs: 250
    monitorSlaLoopPeriodicityMs: 250
    multipleConditionPurgeLoopPeriodicityMs: 1000
  grpc:
    maxRetryAttempts: 1
    shutdownTimeout: 3s

  controller:
    port: ${random.int[20000,32000]} # keep out of the ephemeral port range (32768-60999): an outbound socket could steal a random.port between config resolution and the controller bind
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}
# Disable Micronaut GRPC
grpc:
  server:
    enabled: false
    health:
      enabled: false

logger:
  levels:
    "io.kestra.core.migration": WARN