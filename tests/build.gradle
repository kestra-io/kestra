dependencies {
    annotationProcessor project(':processor')

    implementation project(':core')
    // Problems asserts on webserver problem responses, so it needs those types to compile — but compileOnly,
    // not implementation: every module's tests consume this one, and putting the webserver on their runtime
    // classpath starts its controllers and filters inside their application contexts. The two modules that
    // actually use Problems (webserver, webserver-ee) already have the webserver at runtime.
    compileOnly project(':webserver')
    implementation project(':worker')
    implementation project(':scheduler')
    implementation project(':executor')
    implementation project(':indexer')
    implementation "io.micronaut:micronaut-runtime"
    implementation "io.micronaut.test:micronaut-test-junit5"
    api "io.micronaut:micronaut-http-client"

    implementation "org.junit.jupiter:junit-jupiter-engine"
    implementation "org.junit.jupiter:junit-jupiter-params"

    api 'org.hamcrest:hamcrest:3.0'
    api 'org.hamcrest:hamcrest-library:3.0'
    api 'org.mockito:mockito-junit-jupiter'
    api 'org.assertj:assertj-core:3.27.7'
    api "org.junit.platform:junit-platform-launcher"

    testImplementation "com.tngtech.archunit:archunit-junit5"
}
