id: approval-approve-behavior-fail
namespace: io.kestra.tests

tasks:
  - id: approval
    type: io.kestra.plugin.core.flow.Approval
    approveBehavior: FAIL
    onWait:
      - id: notify
        type: io.kestra.plugin.core.log.Log
        message: "Approval requested"
    onApprove:
      - id: approved
        type: io.kestra.plugin.core.log.Log
        message: "Approved"
    onDeny:
      - id: denied
        type: io.kestra.plugin.core.log.Log
        message: "Denied"

errors:
  - id: cleanup
    type: io.kestra.plugin.core.log.Log
    message: "Cleaning up after failure"
