name: Pull Request Workflow

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-pr
  cancel-in-progress: true

jobs:
  poc:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout - EE
        uses: actions/checkout@v4
        with:
          repository: kestra-io/kestra-ee
          path: kestra-ee
          ref: develop

      - name: Checkout - current PR
        uses: actions/checkout@v4
        with:
          path: kestra

      - name: GCP - Auth with unit test account
        id: auth
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT != 0 }}
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ env.GOOGLE_SERVICE_ACCOUNT }}'
      - name: setup init
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: 'true'
          node-enabled: 'true'

      - name: build OSS UI required for EE UI build
        shell: bash
        working-directory: kestra/ui
        run: npm ci

      - name: OSS UI unit tests
        working-directory: kestra/ui
        run: npm run build && npm run test:unit

      - name: Compile EE
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        working-directory: kestra-ee
        run: |
          ./gradlew compileJava javadoc --parallel