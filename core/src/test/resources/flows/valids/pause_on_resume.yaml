id: pause_on_resume
namespace: io.kestra.tests

tasks:
  - id: pause
    type: io.kestra.plugin.core.flow.Pause
    inputs:
      - id: asked
        type: STRING
      - id: data
        type: FILE
        required: false
      - id: secret_pause
        type: SECRET


  - id: last
    type: io.kestra.plugin.core.output.OutputValues
    values:
      asked: "{{outputs.pause.inputs.asked}}"
      data: "{{outputs.pause.inputs.data}}"
      secret_pause: "{{outputs.pause.inputs.secret_pause}}"