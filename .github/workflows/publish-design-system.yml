name: Publish Design System

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      package:
        description: What package to publish
        required: true
        type: choice
        options:
          - design-system
          - topology

      skip-test:
        description: "Skip test"
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "false"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      PACKAGE: ${{ inputs.package }}
      INCREMENT: ${{ inputs.increment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: inputs.skip-test != 'true' && inputs.package == 'design-system'
        run: npx playwright install --with-deps chromium

      - name: Run tests
        if: inputs.skip-test != 'true'
        run: npm run test --workspace "@kestra-io/$PACKAGE"

      - name: Build
        run: npm run build --workspace "@kestra-io/$PACKAGE"

      - name: Remove export changes
        run: git reset --hard HEAD

      - name: Extract latest published version from npmjs.com
        run: |
          publishedVersion=$(npm view "@kestra-io/$PACKAGE" version --registry https://registry.npmjs.org)
          echo "Latest published version: $publishedVersion"
          # Set the version in package.json to the latest published version to ensure correct version bumping
          npm pkg set --workspace "@kestra-io/$PACKAGE" version="$publishedVersion"
          # Bump the version based on the input increment (patch, minor, major)
          newVersion=$(npm version "$INCREMENT" --workspace "@kestra-io/$PACKAGE" --no-git-tag-version)
          echo "New version: $newVersion"

      - name: Read new version
        id: version
        # Read the new version from the package.json and set it as an output for later steps
        run: echo "value=$(npm pkg get version --workspace "@kestra-io/$PACKAGE" | jq -r --arg pkg "@kestra-io/$PACKAGE" '.[$pkg]')" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # setup the bot for commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # tag the version and push
          git tag "$PACKAGE/v$VERSION"
          git push --tags

      # Trusted publishing need npm 11.+
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm version

      - name: Publish to npm
        run: npm publish --workspace "@kestra-io/$PACKAGE" --access public

      - name: Create release tarball
        run: npm pack --workspace "@kestra-io/$PACKAGE" --pack-destination "packages/$PACKAGE"