id: approval-basic
namespace: io.kestra.tests

tasks:
  - id: approval
    type: io.kestra.plugin.core.flow.Approval
    onWait:
      - id: notify
        type: io.kestra.plugin.core.log.Log
        message: "Approval requested"
    onApprove:
      - id: approved
        type: io.kestra.plugin.core.log.Log
        message: "Approved"
    onDeny:
      - id: denied
        type: io.kestra.plugin.core.log.Log
        message: "Denied"
  - id: last
    type: io.kestra.plugin.core.debug.Return
    format: "{{task.id}} > {{taskrun.startDate}}"
