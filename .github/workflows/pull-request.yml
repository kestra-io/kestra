name: Pull Request Workflow

on:
  pull_request:
permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-pr
  cancel-in-progress: true
# FIXME revert this file once debugging is done
jobs:
  test:
    name: Backend - Tests
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        name: Checkout - Current ref
        with:
          fetch-depth: 0

      # Setup build
      - uses: kestra-io/actions/composite/setup-build@main
        name: Setup - Build
        id: build
        with:
          java-enabled: true
          node-enabled: true
          python-enabled: true

      # Services
      - name: Setup - Start docker compose
        shell: bash
        run: docker compose -f docker-compose-ci.yml up -d

      - name: javadoc
        shell: bash
        run: |
          ./gradlew javadoc --parallel

      - name: unitTest
        shell: bash
        run: |
          ./gradlew unitTest --parallel

      - name: flakyTest
        shell: bash
        run: |
          ./gradlew flakyTest

      - name: check
        if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
        shell: bash
        run: |
          ./gradlew check --parallel

      - name: comment PR with test report
        if: ${{ !cancelled()}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --ci $(pwd)

      - name: generate PR test report in logs on fork or not in PRs
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors $(pwd)

      # Report Java
      - name: Report - Java
        uses: kestra-io/actions/composite/report-java@main
        if: ${{ !cancelled() }}
        with:
          secrets: ${{ toJSON(secrets) }}