plugins {
    id 'com.github.node-gradle.node'
}

node {
    download = true
    version = '22.13.0'
    npmInstallCommand = "ci"
}

tasks.register('assembleFrontend', NpmTask) {
    // Ensure the OpenAPI spec is generated before building the frontend so that
    // the TypeScript client (generated via openapi-ts) is always up to date.
    dependsOn npmInstall, ':webserver-api:generateOpenapiSpec'
    description = 'Builds the frontend'

    inputs.files(fileTree('node_modules'))
    inputs.files(fileTree('src'))
    inputs.file('index.html')
    inputs.file('package.json')
    inputs.file('vite.config.js')
    inputs.file('openapi-ts.config.ts')
    inputs.file('../openapi.yml')

    args = ['run', 'build']
    outputs.dir('../webserver/src/main/resources/ui')
}