id: labels
namespace: sanitychecks.core

labels:
  dependencies.plugins: "[execution.Assert]"

tasks:
  - id: label_simple
    type: io.kestra.plugin.core.execution.Labels
    labels:
      test_one: value_one
      test_two: "{{ false == false }}"

  - id: simple_assert
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ labels.test_one == 'value_one' }}"

  - id: label_replacement
    type: io.kestra.plugin.core.execution.Labels
    labels:
      test_one: value_two
  
  - id: label_property_formating
    type: io.kestra.plugin.core.execution.Labels
    labels:
      - key: order_id
        value: "{{ 'something' }}"

  - id: label_property_formatting_empty_array
    type: io.kestra.plugin.core.execution.Labels
    labels: []

  - id: scnd_assert
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ labels.test_one == 'value_two' }}"
      - "{{ labels.test_two == 'true' }}"
