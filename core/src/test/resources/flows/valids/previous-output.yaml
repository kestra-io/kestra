id: prefix_indices_sum
namespace: io.kestra.tests

tasks:
  - id: each
    type: io.kestra.plugin.core.flow.ForEach
    values: '["1", "3", "5", "10", "12", "14"]'
    tasks:
      - id: even_indices_prefix_sum
        type: io.kestra.plugin.core.debug.Return
        format: >-
          {% set idx = taskrun.iteration %}
          {% if idx == 0 %}
            {{ taskrun.value | trim | number }}
          {% elseif idx is even %}
            {{ (outputFromIteration(idx - 2) | trim | number + taskrun.value | trim | number) }}
          {% else %}
            {{ outputFromIteration(idx - 1) | trim | number }}
          {% endif %}

      - id: prefix_sum
        type: io.kestra.plugin.core.debug.Return
        format: >-
          {% set idx = taskrun.iteration %}
          {% if idx == 0 %}
            {{ taskrun.value | trim | number }}
          {% else %}
            {{ (outputFromIteration(idx - 1) | trim | number + taskrun.value | trim | number) }}
          {% endif %}

