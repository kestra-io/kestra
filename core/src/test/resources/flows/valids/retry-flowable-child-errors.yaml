id: retry-flowable-child-errors
namespace: io.kestra.tests

tasks:
  - id: flowable
    type: io.kestra.plugin.core.flow.Sequential
    retry:
      type: constant
      interval: PT0.1S
      maxAttempts: 2
    tasks:
      - id: child
        type: io.kestra.plugin.core.execution.Fail

errors:
  - id: handler
    type: io.kestra.plugin.core.log.Log
    message: "errors handler ran"
