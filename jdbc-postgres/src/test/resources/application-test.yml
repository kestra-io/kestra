datasources:
  postgres:
    url: jdbc:postgresql://localhost:5432/kestra_unit
    driverClassName: org.postgresql.Driver
    username: kestra
    password: k3str4
    dialect: POSTGRES

kestra:
  serverType: STANDALONE
  queue:
    type: postgres
    messageProtection:
      enabled: true
      limit: 1048576
  repository:
    type: postgres
  storage:
    type: local
    local:
      basePath: /tmp/unittest
  jdbc:
    queues:
      minPollInterval: 10ms
      maxPollInterval: 100ms
      pollSwitchInterval: 5s
  executor:
    executionDelayLoopPeriodicityMs: 250
    monitorSlaLoopPeriodicityMs: 250
    multipleConditionPurgeLoopPeriodicityMs: 1000
  tasks:
    subflow:
      allowParameterOutputs: true
  server:
    liveness:
      enabled: false
    terminationGracePeriod: 5s
    service:
      purge:
        initialDelay: 1h
        fixedDelay: 1d
        retention: 30d
  grpc:
    maxRetryAttempts: 1
    shutdownTimeout: 3s
  controller:
    port: ${random.int[20000,32000]} # keep out of the ephemeral port range (32768-60999): an outbound socket could steal a random.port between config resolution and the controller bind
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}
# Disable Micronaut embedded gRPC server and health check
grpc:
  server:
    enabled: false
    health:
      enabled: false

logger:
  levels:
    "io.kestra.core.migration": WARN