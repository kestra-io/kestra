title: Overview
description: Default Flow Overview

timeWindow:
  default: PT24H
  max: P365D

charts:
  - id: kpi_success_ratio
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Success Ratio
      numberType: PERCENTAGE
      color: SUCCESS
      width: 3
      rowSpan: 1
    data:
      type: io.kestra.plugin.core.dashboard.data.ExecutionsKPI
      columns:
        field: ID
        agg: COUNT
      numerator:
        - type: IN
          field: STATE
          values:
            - SUCCESS

  - id: total_executions_timeseries
    type: io.kestra.plugin.core.dashboard.chart.TimeSeries
    chartOptions:
      displayName: Total Executions
      description: Executions duration and count per date
      legend:
        enabled: true
      column: date
      colorByColumn: state
      width: 9
      rowSpan: 2
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        date:
          field: START_DATE
          displayName: Date
        state:
          field: STATE
        total:
          displayName: Executions
          agg: COUNT
          graphStyle: BARS
        duration:
          field: DURATION
          displayName: Duration
          agg: SUM
          graphStyle: LINES

  - id: kpi_failed_ratio
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Failed Ratio
      numberType: PERCENTAGE
      color: DANGER
      width: 3
      rowSpan: 1
    data:
      type: io.kestra.plugin.core.dashboard.data.ExecutionsKPI
      columns:
        field: ID
        agg: COUNT
      numerator:
        - type: IN
          field: STATE
          values:
            - FAILED

  - id: recent_failures
    type: io.kestra.plugin.core.dashboard.chart.FailedExecutions
    chartOptions:
      displayName: Recent failures
      description: Failed executions in the selected time window. Click a row to inspect ERROR logs.
      pagination:
        enabled: true
      width: 12
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        id:
          field: ID
          displayName: Execution ID
        flowId:
          field: FLOW_ID
          displayName: Flow
        state:
          field: STATE
          displayName: State
        startDate:
          field: START_DATE
          displayName: Start Date
        duration:
          field: DURATION
          displayName: Duration

  - id: executions_in_progress
    type: io.kestra.plugin.core.dashboard.chart.Table
    chartOptions:
      displayName: Executions in progress
      pagination:
        enabled: true
      width: 12
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        id:
          field: ID
          displayName: Execution ID
        namespace:
          field: NAMESPACE
          displayName: Namespace
        flow:
          field: FLOW_ID
          displayName: Flow
        start_date:
          field: START_DATE
          displayName: Start Date
        state:
          field: STATE
          displayName: State
      where:
        - type: IN
          field: STATE
          values:
            - CREATED
            - RESTARTED
            - QUEUED
            - RUNNING
            - PAUSED
            - RETRYING
            - KILLING

  - id: next_executions
    type: io.kestra.plugin.core.dashboard.chart.Table
    chartOptions:
      displayName: Next executions
      pagination:
        enabled: true
      width: 12
    data:
      type: io.kestra.plugin.core.dashboard.data.Triggers
      columns:
        namespace:
          field: NAMESPACE
          displayName: Namespace
        flowId:
          field: FLOW_ID
          displayName: Flow
        nextExec:
          field: NEXT_EXECUTION_DATE
          displayName: Next Execution Date

  - id: logs_timeseries
    type: io.kestra.plugin.core.dashboard.chart.TimeSeries
    chartOptions:
      displayName: Logs
      description: Logs count per date grouped by level
      legend:
        enabled: true
      column: date
      colorByColumn: level
      width: 12
    data:
      type: io.kestra.plugin.core.dashboard.data.Logs
      columns:
        date:
          field: DATE
          displayName: Execution Date
        level:
          field: LEVEL
        total:
          displayName: Total Executions
          agg: COUNT
          graphStyle: BARS

  - id: description
    type: io.kestra.plugin.core.dashboard.chart.Markdown
    chartOptions:
      displayName: Description
      width: 12
    source:
      type: FlowDescription
      namespace: --NAMESPACE--
      flowId: --FLOW--
