// Browser-facing module: serves the Vue SPA static assets and depends on webserver-api for the REST API.
// Depend on :webserver-api alone when you only need the REST API (e.g. during frontend development).
configurations {
    implementation.extendsFrom(micronaut)
}

dependencies {
    api project(':webserver-api')
    implementation project(':core')
    implementation "io.micronaut:micronaut-http-server-netty"
}

// Static assets are written here by ui:assembleFrontend — process resources after that task runs.
if (rootProject.name == "kestra") {
    tasks.named('processResources') {
        mustRunAfter(':ui:assembleFrontend')
    }
}
