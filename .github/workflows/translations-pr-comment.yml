name: Translations - PR comment

# The generate job of the PR workflow never runs on a pull request from a fork (no key there), and that job
# cannot comment either: a fork's pull request runs with a read-only token. When the translation gate then
# reports missing or stale keys, this workflow posts one short comment saying how to trigger the generation
# by hand. `workflow_run` executes in the base repository's context, with a token that can write. Pull
# requests from this repository get their translations generated by the PR workflow and never see it.
on:
  workflow_run:
    workflows: ["Pull Request Workflow"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    name: 'Translations - Fork pull request note'
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      MARKER: "<!-- KESTRA-TRANSLATIONS-COMMENT -->"
    steps:
      # No artifact means the translations job did not run (no UI change): nothing to say. The report
      # decides whether generation is what is missing: missing keys, or keys whose English changed.
      - name: Read the translation report
        id: report
        run: |
          if ! gh run download "${{ github.event.workflow_run.id }}" -R "${{ github.repository }}" -n translations-report -D report 2>/dev/null; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No translation report on this run."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          jq -r '"pr=\(.pr)\nfork=\(.fork)"' report/meta.json >> "$GITHUB_OUTPUT"
          NEEDS=$(jq -r '((.missing // {} | map_values(length) | add // 0) + (.stale // [] | length)) > 0' report/report.json)
          echo "needs_generation=$NEEDS" >> "$GITHUB_OUTPUT"
          cat report/meta.json; echo "needs generation: $NEEDS"

      # One comment per pull request, found by its marker: posted while generation is needed, removed
      # once the check passes so a fixed pull request does not keep the stale note.
      - name: Post or clear the note
        if: steps.report.outputs.found == 'true' && steps.report.outputs.fork == 'true'
        env:
          PR: ${{ steps.report.outputs.pr }}
          NEEDS: ${{ steps.report.outputs.needs_generation }}
        run: |
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ "$NEEDS" = "true" ]; then
            sed -E 's/^ {4}//' <<'NOTE' > note.md
              <!-- KESTRA-TRANSLATIONS-COMMENT -->
              ### 🌐 The translations of this pull request need generating

              It adds or changes English UI text, and the job that generates the other languages does not run on a pull request from a fork (it needs a key the fork does not have), so the translation check stays red until someone generates them. Any one of these does it:

              - **A Kestra maintainer:** open the *Actions* tab, pick **Translations - Generate for a pull request**, click *Run workflow* and enter `PR_NUMBER`. The commit lands on this branch when the pull request allows edits from maintainers; otherwise the run attaches the generated files as a patch artifact and comments here with the command to apply it.
              - **You, the author:** tick *Allow edits from maintainers* in the sidebar and ask a maintainer to run it, or generate locally with `cd ui && GEMINI_API_KEY=<key> npm run translations:generate && npm run translations:check` and commit `ui/src/translations/*.json` together with `ui/scripts/translations/fingerprints*.json`.

              Only `ui/src/translations/en.json` is written by hand; every other language is generated from it.
          NOTE
            sed -i "s/PR_NUMBER/$PR/" note.md
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -F body=@note.md --silent
              echo "Updated the note on #$PR"
            else
              gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@note.md --silent
              echo "Posted the note on #$PR"
            fi
          elif [ -n "$EXISTING" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$EXISTING" --silent
            echo "Nothing left to generate, removed the note from #$PR"
          else
            echo "Nothing to generate on #$PR"
          fi
