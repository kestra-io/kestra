id: iteration-outputs
namespace: io.kestra.tests

tasks:
  - id: outer
    type: io.kestra.plugin.core.flow.ForEach
    values: '["100", "200", "300"]'
    tasks:
      - id: each
        type: io.kestra.plugin.core.flow.ForEach
        values: '["1", "3", "5", "10", "12", "14"]'
        tasks:
          - id: inner_even_indices_sum
            type: io.kestra.plugin.core.debug.Return
            format: >-
              {% set idx = taskrun.iteration %}
              {% if idx == 0 %}
                {{ taskrun.value | trim | number + parents[0].taskrun.value | trim |number }}
              {% elseif idx is even %}
                {{ (iterationOutputs(idx - 2, 'inner_even_indices_sum') | trim | number + taskrun.value | trim | number + parents[0].taskrun.value | trim |number) }}
              {% else %}
                {{ iterationOutputs(idx - 1) | trim | number }}
              {% endif %}
          - id: iteration_output_sibling
            type: io.kestra.plugin.core.debug.Return
            format: >-
              {% set idx = taskrun.iteration %}
              {% if idx <= 1 %}
                {{ taskrun.value | trim | number + parents[0].taskrun.value | trim | number }}
              {% else %}
                {{ iterationOutputs(idx - 2, 'inner_even_indices_sum') | trim | number }}
              {% endif %}
      - id: outer_prefix_sum
        type: io.kestra.plugin.core.debug.Return
        format: >-
          {% set idx = taskrun.iteration %}
          {% if idx == 0 %}
            {{ taskrun.value | trim | number }}
          {% else %}
            {{ iterationOutputs(idx - 1) | trim | number + taskrun.value | trim | number}}
          {% endif %}
      - id: default_all_prefix_sum
        type: io.kestra.plugin.core.debug.Return
        format: >-
          {% set idx = taskrun.iteration %}
          {% if idx == 0 %}
            {{ taskrun.value | trim | number }}
          {% else %}
            {{ iterationOutputs() | trim | number + iterationOutputs(null, null) | trim | number + taskrun.value | trim | number}}
          {% endif %}

      - id: default_iteration_prefix_sum
        type: io.kestra.plugin.core.debug.Return
        format: >-
          {% set idx = taskrun.iteration %}
          {% if idx == 0 %}
            {{ taskrun.value | trim | number }}
          {% else %}
            {{ iterationOutputs(null, 'default_iteration_prefix_sum') | trim | number + taskrun.value | trim | number}}
          {% endif %}

      - id: default_task_id_prefix_sum
        type: io.kestra.plugin.core.debug.Return
        format: >-
          {% set idx = taskrun.iteration %}
          {% if idx == 0 %}
            {{ taskrun.value | trim | number }}
          {% else %}
            {{ iterationOutputs(idx-1, null) | trim | number + taskrun.value | trim | number}}
          {% endif %}
