id: switch-flowable-parallel
namespace: io.kestra.tests

tasks:
  - id: my_flowable_switch
    type: io.kestra.plugin.core.flow.Switch
    allowFailure: true
    value: "A"
    cases:
      "A":
        - id: task_A
          type: io.kestra.plugin.core.flow.Sleep
          duration: PT2S

        - id: task_B
          type: io.kestra.plugin.core.flow.Sleep
          duration: PT2S