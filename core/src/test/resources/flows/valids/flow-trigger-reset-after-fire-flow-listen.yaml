id: flow-trigger-reset-after-fire-flow-listen
namespace: io.kestra.tests.trigger.reset.after.fire

triggers:
  - id: flow
    type: io.kestra.plugin.core.trigger.Flow
    dependsOn:
      - namespace: io.kestra.tests.trigger.reset.after.fire
        flowId: flow-trigger-reset-after-fire-flow-a
        states: [SUCCESS]
      - namespace: io.kestra.tests.trigger.reset.after.fire
        flowId: flow-trigger-reset-after-fire-flow-b
        states: [SUCCESS]
    window:
      every: P1D

tasks:
  - id: only
    type: io.kestra.plugin.core.debug.Return
    format: "It works"
