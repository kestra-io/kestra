id: flow-trigger-depends-on-outputs-flow-listen
namespace: io.kestra.tests.trigger.depends.on.outputs

triggers:
  - id: listen
    type: io.kestra.plugin.core.trigger.Flow
    dependsOn:
      - namespace: io.kestra.tests.trigger.depends.on.outputs
        flowId: flow-trigger-depends-on-outputs-flow-a
        states: [SUCCESS]
      - namespace: io.kestra.tests.trigger.depends.on.outputs
        flowId: flow-trigger-depends-on-outputs-flow-b
        states: [SUCCESS]

tasks:
  - id: only
    type: io.kestra.plugin.core.debug.Return
    format: "{{ trigger.outputs }}"
