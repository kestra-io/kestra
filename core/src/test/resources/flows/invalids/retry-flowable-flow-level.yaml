id: retry-flowable-flow-level
namespace: io.kestra.tests

retry:
  type: constant
  maxAttempts: 2
  interval: PT1S
  behavior: RETRY_FLOWABLE

tasks:
  - id: seq
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: hello
        type: io.kestra.plugin.core.log.Log
        message: hi
