name: Pull Request Workflow

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  add-to-project:
    name: Add PR to GitHub Project
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get Project ID
        id: get-project
        run: |
          PROJECT_ID=$(gh api graphql -f query='
          query {
            organization(login: "kestra-io") {
              projectsV2(first: 20) {
                nodes {
                  id
                  number
                }
              }
            }
          }' | jq -r '.data.organization.projectsV2.nodes[] | select(.number == 16) | .id')
          
          echo "Project ID: $PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Add PR to Project
        id: add-item
        run: |
          ITEM_ID=$(gh api graphql -f query='
          mutation($projectId: ID!, $contentId: ID!) {
            addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
              item { id }
            }
          }' -F projectId="$PROJECT_ID" -F contentId="${{ github.event.pull_request.node_id }}" | jq -r '.data.addProjectV2ItemById.item.id')
          
          echo "Item ID: $ITEM_ID"
          echo "ITEM_ID=$ITEM_ID" >> $GITHUB_ENV

      - name: Get Contribution Field ID
        id: get-field
        run: |
          FIELD_ID=$(gh api graphql -f query='
          query {
            node(id: "'"$PROJECT_ID"'") {
              ... on ProjectV2 {
                fields(first: 20) {
                  nodes {
                    id
                    name
                  }
                }
              }
            }
          }' | jq -r '.data.node.fields.nodes[] | select(.name == "Contribution") | .id')

          echo "Field ID: $FIELD_ID"
          echo "FIELD_ID=$FIELD_ID" >> $GITHUB_ENV

      - name: Check PR Author Type
        id: check-author
        run: |
          PR_AUTHOR=$(gh api repos/kestra-io/kestra/pulls/${{ github.event.pull_request.number }} --jq '.user.login')
          echo "PR Author: $PR_AUTHOR"

          if gh api orgs/kestra-io/members/$PR_AUTHOR --silent; then
            echo "CONTRIBUTION_TYPE=Internal" >> $GITHUB_ENV
          else
            echo "CONTRIBUTION_TYPE=External" >> $GITHUB_ENV
          fi

      - name: Update Project Fields
        run: |
          gh api graphql -f query='
          mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
            updateProjectV2ItemFieldValue(input: {
              projectId: $projectId,
              itemId: $itemId,
              fieldId: $fieldId,
              value: {text: $value}
            }) {
              projectV2Item { id }
            }
          }' -F projectId="$PROJECT_ID" -F itemId="$ITEM_ID" -F fieldId="$FIELD_ID" -F value="$CONTRIBUTION_TYPE"

  file-changes:
    name: File changes detection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
      translations: ${{ steps.changes.outputs.translations }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ui:
              - 'ui/**'
            translations:
              - 'ui/src/translations/**'
            backend:
              - '!{ui,.github}/**'
          token: ${{ secrets.GITHUB_TOKEN }}

  translations:
    name: 'Translations - Generate translations'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: file-changes
    steps:
        - uses: actions/checkout@v4
          name: Checkout - Current ref
          if: "needs.file-changes.outputs.translations == 'true'"

        - id: generate-translations
          name: Translations - Generate translations
          if: "needs.file-changes.outputs.translations == 'true'"
          uses: ./.github/actions/generate-translations
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
          env:
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  frontend:
    name: Frontend - Tests
    needs: [file-changes, translations]
    if: "needs.file-changes.outputs.ui == 'true'"
    uses: ./.github/workflows/workflow-frontend-test.yml
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend:
    name: Backend - Tests
    needs: file-changes
    if: "needs.file-changes.outputs.backend == 'true'"
    uses: ./.github/workflows/workflow-backend-test.yml
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

  end:
    name: End
    runs-on: ubuntu-latest
    if: always()
    needs: [frontend, backend]
    steps:
      # Slack
      - name: Slack notification
        uses: Gamesight/slack-workflow-status@master
        if: ${{ always() && env.SLACK_WEBHOOK_URL != 0 }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          name: GitHub Actions
          icon_emoji: ":github-actions:"
          channel: "C02DQ1A7JLR"