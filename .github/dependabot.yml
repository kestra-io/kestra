# See GitHub's docs for more information on this file:
# https://docs.github.com/en/free-pro-team@latest/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    target-branch: develop
    directory: "/"
    schedule:
      interval: "daily"
      timezone: "Europe/Paris"
      time: "06:00"
    # cooldown never delays security updates, Kestra's own actions are never delayed
    cooldown:
      default-days: 7
      exclude: ["kestra-io/*"]
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 20
    labels: ["dependency-upgrade", "area/devops"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # Maintain dependencies for Gradle modules
  - package-ecosystem: "gradle"
    target-branch: develop
    directory: "/"
    schedule:
      interval: "daily"
      timezone: "Europe/Paris"
      time: "06:00"
    # cooldown never delays security updates, Kestra's own artifacts are never delayed
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
      exclude: ["io.kestra*"]
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 20
    labels: ["dependency-upgrade", "area/backend"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      gradle-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # Ignore versions of Maven Resolver >= 2.0.11 as we're not ready yet see https://github.com/kestra-io/kestra/issues/22235
      - dependency-name: "org.apache.maven.resolver:*"
        versions: [ ">=2.0.11" ]
      # Ignore versions of Jetty >= 12.1.0 as Wiremock didn't work with it see https://github.com/kestra-io/kestra/issues/22238
      - dependency-name: "org.eclipse.jetty:*"
        versions: [ ">=12.1.0" ]


  # Maintain dependencies for NPM modules (core UI)
  - package-ecosystem: "npm"
    target-branch: develop
    directory: "/ui"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    schedule:
      interval: "daily"
      timezone: "Europe/Paris"
      time: "06:00"
    # cooldown never delays security updates, Kestra's own packages are never delayed
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
      exclude: ["@kestra-io/*"]
    open-pull-requests-limit: 20
    labels: ["dependency-upgrade", "area/frontend"]
    groups:
      # must stay first: a dependency is assigned to the first group matching it
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

      build:
        applies-to: version-updates
        patterns:
          ["@esbuild/*", "@rollup/*", "@rolldown/*", "@swc/*", "lightningcss-*", "tsdown", "@tsdown/*"]

      types:
        applies-to: version-updates
        patterns: ["@types/*"]

      storybook:
        applies-to: version-updates
        patterns: ["storybook*", "@storybook/*"]

      linting:
        applies-to: version-updates
        patterns: ["oxlint", "eslint-plugin-oxlint"]

      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]

      major:
        update-types: ["major"]
        applies-to: version-updates
        exclude-patterns:
          [
            "@esbuild/*",
            "@rollup/*",
            "@rolldown/*",
            "@swc/*",
            "lightningcss-*",
            "tsdown",
            "@tsdown/*",
            "@types/*",
            "storybook*",
            "@storybook/*",
            "oxlint",
            "eslint-plugin-oxlint",
            "vitest",
            "@vitest/*",
          ]

      minor:
        update-types: ["minor"]
        applies-to: version-updates
        exclude-patterns: [
            "@esbuild/*",
            "@rollup/*",
            "@rolldown/*",
            "@swc/*",
            "lightningcss-*",
            "tsdown",
            "@tsdown/*",
            "@types/*",
            "storybook*",
            "@storybook/*",
            "oxlint",
            "eslint-plugin-oxlint",
            "vitest",
            "@vitest/*",
            # Temporary exclusion of these packages from minor updates
            "monaco-editor",
          ]

      patch:
        update-types: ["patch"]
        applies-to: version-updates
        exclude-patterns:
          [
            "@esbuild/*",
            "@rollup/*",
            "@rolldown/*",
            "@swc/*",
            "lightningcss-*",
            "tsdown",
            "@tsdown/*",
            "@types/*",
            "storybook*",
            "@storybook/*",
            "oxlint",
            "eslint-plugin-oxlint",
            "vitest",
            "@vitest/*",
          ]

    ignore:
      # Ignore TypeScript major updates (most dependencies do not support v7 yet)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # Ignore eslint major updates (eslint@10 currently conflicts with eslint-plugin-vue)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

      # Ignore eslint-plugin-vue all updates (v10 requires eslint ^10 but project is on eslint ^9)
      - dependency-name: "eslint-plugin-vue"
        versions: ["*"]

      # Ignore updates to monaco-yaml; version is pinned to 5.3.1 due to patch-package script additions
      - dependency-name: "monaco-yaml"
        versions: [">=5.3.2"]

