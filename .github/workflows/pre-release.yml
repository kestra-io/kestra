name: Pre Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip-test:
        description: 'Skip test'
        type: choice
        required: true
        default: 'false'
        options:
          - "true"
          - "false"
      runner:
        description: 'Runner label to run the CI jobs on.'
        type: string
        default: 'ubuntu-latest'
        required: false

# kestra-io/actions PR #190 (adds the `runner` input above) is not merged yet, so the
# reusable-workflow calls in this file temporarily pin to that PR's branch instead of @main.
# Switch them back to @main once it merges.
jobs:
  print-runner:
    name: Print selected runner
    runs-on: ubuntu-latest
    steps:
      - name: Echo runner input
        run: "echo 'CI jobs will run on runner: ${{ inputs.runner || 'ubuntu-latest' }}'"

  build-artifacts:
    name: Build Artifacts
    uses: kestra-io/actions/.github/workflows/kestra-oss-build-artifacts.yml@feat/opt-in-larger-runners
    secrets:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}
    with:
      java-version: 25
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  backend-tests:
    name: Backend tests
    uses: kestra-io/actions/.github/workflows/kestra-oss-backend-tests.yml@feat/opt-in-larger-runners
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
    with:
      java-version: 25
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  frontend-tests:
    name: Frontend tests
    uses: kestra-io/actions/.github/workflows/kestra-oss-frontend-tests.yml@feat/opt-in-larger-runners
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  design-system-frontend-tests:
    name: Design System Frontend tests
    uses: kestra-io/actions/.github/workflows/kestra-oss-designsystem-tests.yml@feat/opt-in-larger-runners
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  publish-maven:
    name: Publish Maven
    needs: [ backend-tests, frontend-tests, design-system-frontend-tests ]
    if: "!failure() && !cancelled()"
    uses: kestra-io/actions/.github/workflows/kestra-oss-publish-maven.yml@feat/opt-in-larger-runners
    secrets:
      SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SONATYPE_GPG_KEYID: ${{ secrets.SONATYPE_GPG_KEYID }}
      SONATYPE_GPG_PASSWORD: ${{ secrets.SONATYPE_GPG_PASSWORD }}
      SONATYPE_GPG_FILE: ${{ secrets.SONATYPE_GPG_FILE }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}
    with:
      java-version: 25
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  generate-configuration-schema:
    name: Generate Configuration Schema
    needs: [build-artifacts]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Download executable
        uses: actions/download-artifact@v8
        with:
          name: exe
          path: build/executable

      - name: Prepare executable
        run: cp build/executable/* build/executable/kestra && chmod +x build/executable/kestra

      - name: Generate and publish schema
        uses: kestra-io/actions/composite/kestra/kestra-configuration-schema@main
        with:
          kestra-version: ${{ github.ref_name }}
          executable-path: build/executable/kestra
          output-path: oss.json
          gcs-destination: kestra-api-storage_prd/configuration-schema/${{ github.ref_name }}/
          gcp-credentials-json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Slack - Schema generation failure
        if: failure()
        uses: kestra-io/actions/composite/slack-status@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: 'C09FF36GKE1'

  publish-github:
    name: Github Release
    needs: [build-artifacts, backend-tests, frontend-tests]
    if: "!failure() && !cancelled()"
    uses: kestra-io/actions/.github/workflows/kestra-oss-publish-github.yml@feat/opt-in-larger-runners
    with:
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
    secrets: inherit

  otel-export-trace:
    name: OpenTelemetry - Export Trace
    runs-on: ubuntu-latest
    if: always()
    needs: [ build-artifacts, backend-tests, frontend-tests, design-system-frontend-tests, publish-maven, generate-configuration-schema, publish-github ]
    env:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
    steps:
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          mode: export-all
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
