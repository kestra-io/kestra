name: TMP check green commit
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-check-green-commit.yml'
jobs:
  check-green-commit:
    name: Check green commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sha:
          - a65bcad4b6786b7829cab1b173e4080d41369bef
          - 32b7b031f689513bf8d6578d971c5729c00e3223
          - ${{ github.sha }}
    permissions:
      checks: read
    outputs:
      already-green: ${{ steps.check.outputs.already-green }}
    steps:
      - id: check
        # on any error already-green stays unset, so the tests run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          COUNT=$(gh api "repos/${{ github.repository }}/commits/${{ matrix.sha }}/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | select(.name == "Backend tests / Backend - Tests" and .conclusion == "success") | .id' | wc -l)
          echo "Successful 'Backend tests / Backend - Tests' check runs on ${{ matrix.sha }}: $COUNT"
          echo "already-green=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: echo "already-green=${{ steps.check.outputs.already-green }} for ${{ matrix.sha }}"
