name: Homebrew tap

on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/tap-test.yml"
  push:
    branches: [develop]
    paths:
      - "Formula/**"

jobs:
  test:
    name: Audit, install and test the formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tap the repository
        run: brew tap kestra-io/kestra "$GITHUB_WORKSPACE"
      - name: Audit the formula
        run: brew audit --strict --new kestra-io/kestra/kestra
      - name: Install from the tapped formula
        run: brew install kestra-io/kestra/kestra
      - name: Test the installation
        run: brew test --verbose kestra-io/kestra/kestra
