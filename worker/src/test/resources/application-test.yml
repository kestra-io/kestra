micronaut:
  router:
    static-resources:
      ui:
        paths: classpath:ui
        mapping: /ui/**

  http:
    client:
      read-idle-timeout: 60s
      connect-timeout: 30s
      read-timeout: 60s
      http-version: HTTP_1_1
    services:
      api:
        url: http://localhost:28181
  server:
    cors:
      enabled: true
      configurations:
        all:
          allowedOrigins:
            - http://bad-origin
jackson:
  date-time-features:
    WRITE_DATES_AS_TIMESTAMPS: false
    WRITE_DURATIONS_AS_TIMESTAMPS: false
  serialization-inclusion: non_null
  deserialization-features:
    FAIL_ON_UNKNOWN_PROPERTIES: false

kestra:
  url: http://localhost:8081
  encryption:
    secretKey: I6EGNzRESu3X3pKZidrqCGOHQFUFC0yK
  serverType: STANDALONE
  storage:
    type: local
    local:
      basePath: /tmp/unittest
  anonymousUsageReport:
    enabled: true
    uri: https://api.kestra.io/v1/reports/usages
    initialDelay: 5m
    fixedDelay: 1h
  server:
    accessLog:
      enabled: false
    basicAuth:
      username: admin@kestra.io
      password: Kestra123
      openUrls:
        - "/ping"
        - "/api/v1/executions/webhook/"
    liveness:
      enabled: false
    terminationGracePeriod: 5s
    service:
      purge:
        initialDelay: 1h
        fixedDelay: 1d
        retention: 30d
  queue:
    type: h2
  repository:
    type: h2
  grpc:
    maxRetryAttempts: 1
    shutdownTimeout: 3s
  controller:
    port: ${random.int[20000,32000]} # keep out of the ephemeral port range (32768-60999): an outbound socket could steal a random.port between config resolution and the controller bind
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}
# Disable Micronaut embedded gRPC server and health check
grpc:
  server:
    enabled: false
    health:
      enabled: false
datasources:
  h2:
    url: jdbc:h2:mem:public;LOCK_TIMEOUT=30000;TIME ZONE=UTC;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driverClassName: org.h2.Driver

logger:
  levels:
    "io.kestra.core.migration": WARN