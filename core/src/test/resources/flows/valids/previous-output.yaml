id: prefix_sum
namespace: io.kestra.tests

tasks:
  - id: outer
    type: io.kestra.plugin.core.flow.ForEach
    values: '["100", "200", "300"]'
    tasks:
      - id: each
        type: io.kestra.plugin.core.flow.ForEach
        values: '["1", "3", "5", "10", "12", "14"]'
        tasks:
          - id: inner_even_indices_sum
            type: io.kestra.plugin.core.debug.Return
            format: >-
              {% set idx = taskrun.iteration %}
              {% if idx == 0 %}
                {{ taskrun.value | trim | number + parents[0].taskrun.value | trim |number }}
              {% elseif idx is even %}
                {{ (outputFromIteration(idx - 2) | trim | number + taskrun.value | trim | number + parents[0].taskrun.value | trim |number) }}
              {% else %}
                {{ outputFromIteration(idx - 1) | trim | number }}
              {% endif %}
      - id: outer_prefix_sum
        type: io.kestra.plugin.core.debug.Return
        format: >-
          {% set idx = taskrun.iteration %}
          {% if idx == 0 %}
            {{ taskrun.value | trim | number }}
          {% else %}
            {{ outputFromIteration(idx - 1) | trim | number + taskrun.value | trim | number}}
          {% endif %}

