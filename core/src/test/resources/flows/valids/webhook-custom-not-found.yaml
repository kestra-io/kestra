id: webhook-response-probe
namespace: io.kestra.tests

tasks:
  - id: log
    type: io.kestra.plugin.core.log.Log
    message: Webhook received

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: probe
    responseCode: "{{ trigger.parameters.code[0] }}"
    responseHeaders:
      Content-Type: text/plain
      X-Probe: "{{ trigger.parameters.challenge[0] }}"
    responseBody: "{{ trigger.parameters.challenge[0] }}"
