id: loop-nested-with-subflow
namespace: io.kestra.tests

tasks:
  - id: outer
    type: io.kestra.plugin.core.flow.Loop
    concurrencyLimit: 1
    values:
      - 1
      - 2
    tasks:
      - id: inner
        type: io.kestra.plugin.core.flow.Loop
        concurrencyLimit: 0
        values:
          - a
          - b
        tasks:
          - id: subflow
            type: io.kestra.plugin.core.flow.Subflow
            flowId: minimal
            namespace: io.kestra.tests
