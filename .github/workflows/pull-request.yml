name: Pull Request Workflow

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-pr
  cancel-in-progress: true

jobs:
  # When an OSS ci start, we trigger an EE one
  trigger-ee:
    runs-on: ubuntu-latest
    steps:
    # PR pre-check: skip if PR from a fork OR EE already has a branch with same name
    - name: Check EE repo for branch with same name
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
      id: check-ee-branch
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GH_PERSONAL_TOKEN }}
        script: |
          const pr = context.payload.pull_request;
          if (!pr) {
            core.setOutput('exists', 'false');
            return;
          }
          const branch = pr.head.ref;
          const [owner, repo] = 'kestra-io/kestra-ee'.split('/');
          try {
            await github.rest.repos.getBranch({ owner, repo, branch });
            core.setOutput('exists', 'true');
          } catch (e) {
            if (e.status === 404) {
              core.setOutput('exists', 'false');
            } else {
              core.setFailed(e.message);
            }
          }

      # Targeting pull request (only if not from a fork and EE has no branch with same name)
    - name: Trigger EE Workflow (pull request, with payload)
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
      if: ${{ github.event_name == 'pull_request'
        && github.event.pull_request.number != ''
        && github.event.pull_request.head.repo.fork == false
        && steps.check-ee-branch.outputs.exists == 'false' }}
      with:
        token: ${{ secrets.GH_PERSONAL_TOKEN }}
        repository: kestra-io/kestra-ee
        event-type: "oss-updated"
        client-payload: >-
          {"commit_sha":"${{ github.event.pull_request.head.sha }}","pr_repo":"${{ github.repository }}"}

  file-changes:
    if: ${{ github.event.pull_request.draft == false }}
    name: File changes detection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
      translations: ${{ steps.changes.outputs.translations }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            ui:
              - 'ui/**'
            backend:
              - '!{ui,.github}/**'
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend - Tests
    needs: [file-changes]
    if: "needs.file-changes.outputs.ui == 'true'"
    uses: kestra-io/actions/.github/workflows/kestra-oss-frontend-tests.yml@main
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend:
    name: Backend - Tests
    needs: file-changes
    if: "needs.file-changes.outputs.backend == 'true'"
    uses: kestra-io/actions/.github/workflows/kestra-oss-backend-tests.yml@main
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    with:
      java-version: 25

  comment-openapi-spec-changes:
    name: Comment OpenAPI spec changes
    needs: file-changes
    if: "needs.file-changes.outputs.backend == 'true' && github.event.pull_request.draft == false"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        name: Checkout - Current ref

      - uses: kestra-io/actions/composite/setup-build@main
        name: Setup - Build
        with:
          java-enabled: true
          java-version: 25

      - name: Generate OpenAPI spec
        run: ./gradlew generateOpenapiSpec
        shell: bash

      - name: Fetch client-sdk spec
        shell: bash
        run: |
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.GH_PERSONAL_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/kestra-io/client-sdk/contents/kestra.yml" \
            -o /tmp/openapi-client-sdk.yml 2>/dev/null || touch /tmp/openapi-client-sdk.yml

      - name: Compute diff
        id: diff
        shell: bash
        run: |
          diff_output=$(diff /tmp/openapi-client-sdk.yml openapi.yml 2>/dev/null || true)
          if [ -z "$diff_output" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            truncated=$(echo "$diff_output" | head -c 10000)
            {
              echo "diff<<DIFF_EOF"
              echo "$truncated"
              echo "DIFF_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR
        uses: actions/github-script@v9
        env:
          DIFF_OUTPUT: ${{ steps.diff.outputs.diff }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- openapi-spec-changes -->';
            const changed = '${{ steps.diff.outputs.changed }}' === 'true';
            const diff = process.env.DIFF_OUTPUT || '';

            const body = changed
              ? `${marker}\n### OpenAPI Spec Changes\n\nThis PR modifies the OpenAPI spec. Diff against [client-sdk](https://github.com/kestra-io/client-sdk):\n\`\`\`diff\n${diff}\n\`\`\``
              : `${marker}\n### OpenAPI Spec Changes\n\nNo changes to the OpenAPI spec.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  e2e-tests:
    name: E2E - Tests
    uses: kestra-io/actions/.github/workflows/kestra-oss-e2e-tests.yml@main
    with:
      java-version: 25

  generate-pull-request-docker-image:
    name: Generate PR docker image
    uses: kestra-io/actions/.github/workflows/kestra-oss-pullrequest-publish-docker.yml@main
    with:
      java-version: 25
