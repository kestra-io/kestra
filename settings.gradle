plugins {
    id("com.gradle.develocity") version "4.3.2"
    id("com.gradle.common-custom-user-data-gradle-plugin") version "2.4.0"
}
def isCI = System.getenv('CI') != null
// TODO do not merge
buildCache {
    local { enabled = false }                     // must be false for this experiment
    remote(develocity.buildCache) {
        enabled = false                              // must be true for this experiment
        allowUntrustedServer = true                 // set to false if a trusted certificate is configured for the Develocity server
        path = "cache/exp5-2026-march06-take1"        // update 'exp4-2021-dec31-take1' for each new run of the experiment
    }}
// TODO end do not merge

develocity {
    server = "https://develocity.kestra.io"
    buildScan {
        uploadInBackground = !isCI
        publishing.onlyIf {
            it.authenticated
        }
        buildScanPublished { scan ->
            if (isCI) {
                def payload = [
                    timestamp: new Date().toString(),
                    taskNames: gradle.startParameter.taskNames,
                    buildScanId: scan.buildScanId,
                    buildScanUri: scan.buildScanUri.toString()
                ]
                file("develocity-scan-output.ndjson") << groovy.json.JsonOutput.toJson(payload) + System.lineSeparator()
            }
        }
    }
}

rootProject.name = "kestra"


include 'platform'

include 'cli'
include 'core'
include 'tests'

include 'runner-memory'
include 'repository-memory'

include 'storage-local'

include 'jdbc'
include 'jdbc-h2'
include 'jdbc-mysql'
include 'jdbc-postgres'

include 'webserver'
include 'executor'
include 'scheduler'
include 'worker'

include 'ui'
include 'model'
include 'processor'
include 'script'

include 'jmh-benchmarks'
