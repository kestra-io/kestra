jackson:
  date-time-features:
    WRITE_DATES_AS_TIMESTAMPS: false
    WRITE_DURATIONS_AS_TIMESTAMPS: false
  serialization-inclusion: non_null

micronaut:
  metrics:
    export:
      otlp:
        enabled: false

datasources:
  h2:
    url: jdbc:h2:mem:db-${random.uuid};TIME ZONE=UTC;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driverClassName: org.h2.Driver

kestra:
  encryption:
    secretKey: I6EGNzRESu3X3pKZidrqCGOHQFUFC0yK
  url: https://mysuperhost.com/subpath
  serverType: STANDALONE
  repository:
    type: h2
  queue:
    type: h2
  storage:
    type: local
    local:
      basePath: /tmp/unittest
  localFiles:
    # relative to the Gradle test working directory (the module directory)
    allowedPaths:
      - build/resources/test
  jdbc:
    queues:
      minPollInterval: 10ms
      maxPollInterval: 100ms
      pollSwitchInterval: 5s

  executor:
    executionDelayLoopPeriodicityMs: 250
    monitorSlaLoopPeriodicityMs: 250
    multipleConditionPurgeLoopPeriodicityMs: 1000

  variables:
    globals:
      string: "string"
      int: 1
      bool: true
      nested:
        int: 2

  server:
    liveness:
      enabled: false
    service:
      purge:
        initialDelay: 1h
        fixedDelay: 1d
        retention: 30d
    terminationGracePeriod: 5s

  anonymousUsageReport:
    enabled: false
    uri: http://localhost:8080/

  unittest: true

  plugins:
    configurations:
      - type: io.kestra.plugin.Test0
        values:
          prop0: value0
      - type: io.kestra.plugin.Test1
        values:
          prop1: value1
      - type: io.kestra.plugin.Test2
        values:
          prop2: value2
      - type: io.kestra.plugin.core.trigger.Schedule
        values:
          recoverMissedSchedules: ALL
      - type: io.kestra.core.runners.test.task.Alias
        values:
          prop0: value0

  tasks:
    http:
      deniedList:
        - http://dangerous-url.com
        - http://169.254.169.254
        - http://kestra_internal_db
        - 10.0.0.0/8

  grpc:
    maxRetryAttempts: 1
    shutdownTimeout: 3s
  controller:
    port: ${random.int[20000,32000]} # keep out of the ephemeral port range (32768-60999): an outbound socket could steal a random.port between config resolution and the controller bind
    maxConnectionAgeGrace: 0s
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}
# Disable Micronaut embedded gRPC server and health check
grpc:
  server:
    enabled: false
    health:
      enabled: false

logger:
  levels:
    "io.kestra.core.migration": WARN