id: subflow-with-retry
namespace: io.kestra.tests
description: A subflow that fails first but succeeds on retry (attempt = 3)

tasks:
- id: log
  type: io.kestra.plugin.core.log.Log
  message: "Attempt number - {{ execution.attemptsCount }}"
- id: check_counter
  type: io.kestra.plugin.core.flow.If
  condition: "{{ execution.attemptsCount == 3 }}"
  then:
    - id: pass
      type: io.kestra.plugin.core.log.Log
      message: "Success on 3rd attempt!"
  else:
    - id: fail
      type: io.kestra.plugin.core.execution.Fail