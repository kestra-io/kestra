id: blocks-tall-fixture
namespace: company.team
# Deliberately long: the canvas has to overflow the viewport for a jump to be
# distinguishable from "already on screen". Kept short enough that walkTo() can
# still reach the last block within its step bound.
#
# Every section carries at least one block on purpose. buildSectionLanes emits
# triggers, tasks, errors, finally, afterExecution, and an empty section still
# renders a drop zone carrying a data-block-id, which counts as a navigable
# stop. Leaving one empty would put a stop below the block the scrolling tests
# treat as last.
tasks:
  - id: task_01
    type: io.kestra.plugin.core.log.Log
    message: one
  - id: task_02
    type: io.kestra.plugin.core.log.Log
    message: two
  - id: task_03
    type: io.kestra.plugin.core.log.Log
    message: three
  - id: task_04
    type: io.kestra.plugin.core.log.Log
    message: four
  - id: task_05
    type: io.kestra.plugin.core.log.Log
    message: five
  - id: task_06
    type: io.kestra.plugin.core.log.Log
    message: six
  - id: task_07
    type: io.kestra.plugin.core.log.Log
    message: seven
  - id: task_08
    type: io.kestra.plugin.core.log.Log
    message: eight
  - id: task_09
    type: io.kestra.plugin.core.log.Log
    message: nine
  - id: task_10
    type: io.kestra.plugin.core.log.Log
    message: ten
  - id: task_11
    type: io.kestra.plugin.core.log.Log
    message: eleven
  - id: task_12
    type: io.kestra.plugin.core.log.Log
    message: twelve
  - id: task_13
    type: io.kestra.plugin.core.log.Log
    message: thirteen
  - id: task_14
    type: io.kestra.plugin.core.log.Log
    message: fourteen
  - id: task_15
    type: io.kestra.plugin.core.log.Log
    message: fifteen
  - id: task_16
    type: io.kestra.plugin.core.log.Log
    message: sixteen
errors:
  - id: err_handler
    type: io.kestra.plugin.core.log.Log
    message: handled
finally:
  - id: cleanup
    type: io.kestra.plugin.core.log.Log
    message: cleaned up
# afterExecution renders last, so `notify` is the final stop on the canvas: the
# one block with nothing beneath it, and therefore the one that cannot be
# centred however far the canvas scrolls.
afterExecution:
  - id: notify
    type: io.kestra.plugin.core.log.Log
    message: notified
