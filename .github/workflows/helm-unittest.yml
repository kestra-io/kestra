name: Helm Unittest

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm-unittest.yml'
  push:
    branches:
      - develop
    paths:
      - 'charts/**'
      - '.github/workflows/helm-unittest.yml'

permissions:
  contents: read

jobs:
  test:
    name: Helm Unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1

      - name: Run Helm Unittest
        run: helm unittest charts/kestra
