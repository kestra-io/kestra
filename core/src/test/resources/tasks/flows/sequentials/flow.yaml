    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: copyout_chunk1
        type: io.kestra.plugin.jdbc.postgresql.CopyOut
        url: "{{ vars.db_url }}"
        username: "{{ vars.db_username }}"
        password: "{{ vars.db_password }}"
        format: TEXT
        header: true
        sql: SELECT * FROM "{{ inputs.params_json.schema_name }}"."{{ inputs.params_json.object_name }}" WHERE id BETWEEN 1 AND 10000000

