// Umbrella module: aggregates webserver-api (REST API) and webserver-browser (Vue SPA static assets).
// Depend on this module to get both concerns together (e.g. in the CLI or production builds).
// Depend on :webserver-api alone when you only need the REST API (e.g. during frontend development).
configurations {
    implementation.extendsFrom(micronaut)
}

dependencies {
    api project(':webserver-api')
    api project(':webserver-browser')
}
